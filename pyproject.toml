[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glass-workbench"
version = "0.4.2"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
description = "Offline optical glass maps, thermo-optics, first-order screening and Zemax AGF catalog management"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "openpyxl>=3.1,<4",
  "matplotlib>=3.8,<4",
  "PySide6>=6.7,<7",
]

[project.gui-scripts]
glass-workbench = "glass_workbench.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pyinstaller>=6.10,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/glass_workbench"]
exclude = ["src/glass_workbench/assets/**"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "glass_workbench/README.md"
"src/glass_workbench/assets" = "glass_workbench/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
